<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Pick One</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Persistent across all screens: theme + sound toggles. -->
  <div class="controls">
    <button class="control-btn" id="theme-toggle" aria-label="Toggle theme">🌙</button>
    <button class="control-btn" id="sound-toggle" aria-label="Toggle sound">🔊</button>
  </div>
  <div id="app"></div>
  <!-- Persistent footer; hidden on immersive screens via body.hide-footer.
       Buttons open the in-app feedback modal (script.js) which collects
       the message before triggering a mailto. -->
  <footer class="site-footer">
    <button type="button" class="footer-link" data-feedback-kind="category">Request a Category</button>
    <span class="footer-sep" aria-hidden="true">·</span>
    <button type="button" class="footer-link" data-feedback-kind="feedback">Send Feedback</button>
  </footer>
  <script src="script.js"></script>
</body>
</html>
